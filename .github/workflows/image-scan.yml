name: image-scan
# Build the image from source and fail the build if it has fixable
# CRITICAL/HIGH vulnerabilities. Gates PRs and pushes to main so vulns are
# caught before they can be released.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        run: docker buildx build --load -t mcp-hello-go-server:scan .

      # Prove the image starts and serves MCP, not just that it builds: run it
      # and send an MCP initialize through the Makefile's docker-smoke target
      # (the same check `make docker-test` runs against the published image).
      - name: Smoke test the container
        run: |
          docker run -d --name mcp-hello-go -p 8000:8000 mcp-hello-go-server:scan
          # Wait for the server to accept connections, failing loudly if it
          # never does (a crash-looping container would otherwise just hang).
          for i in $(seq 1 30); do
            if curl -s -o /dev/null --max-time 2 http://localhost:8000/mcp; then break; fi
            if [ "$i" = "30" ]; then
              echo "container never became ready; logs:" >&2
              docker logs mcp-hello-go >&2
              exit 1
            fi
            sleep 1
          done
          make docker-smoke CONTAINER=mcp-hello-go HTTP_PORT=8000

      - name: Container logs
        if: always()
        run: docker logs mcp-hello-go || true

      # Gate: fail the build on FIXABLE critical/high vulns. ignore-unfixed
      # means an upstream CVE with no patch yet won't wedge every build.
      - name: Trivy scan (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcp-hello-go-server:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy scan (SARIF report, all severities)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcp-hello-go-server:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
